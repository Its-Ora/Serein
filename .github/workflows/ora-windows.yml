name: Ora Windows build
# Builds the fork for Windows on every push to main (or on demand) and publishes it as a
# GitHub Release, so the newest build is always the "Latest" release.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ora-windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Package app
        run: cargo xtask package
      - name: Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Compress-Archive -Path "dist/*" -DestinationPath "release-assets/serein-ora-windows-portable.zip"
          $installer = Get-ChildItem -Path "dist-installer/*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($installer) {
            Copy-Item -LiteralPath $installer.FullName -Destination "release-assets/serein-ora-setup.exe"
          }
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: serein-ora-windows
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ora-${GITHUB_RUN_NUMBER}"
          subject="$(git log -1 --format=%s)"
          notes="Build automatique de \`${GITHUB_SHA::7}\` : ${subject}

          - **serein-ora-setup.exe** : installeur (garde ton login et tes réglages).
          - **serein-ora-windows-portable.zip** : version sans installation.

          Changements du fork : voir le README."
          gh release create "$tag" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Serein Ora #${GITHUB_RUN_NUMBER}" \
            --notes "$notes" \
            --latest
